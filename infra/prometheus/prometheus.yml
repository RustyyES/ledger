global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: ledger

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: commerce-api
    static_configs: [{targets: ["commerce-api:8000"]}]
  - job_name: metrics-api
    static_configs: [{targets: ["metrics-api:8000"]}]
  - job_name: cdc-sink
    static_configs: [{targets: ["cdc-sink:9103"]}]
  - job_name: loadgen
    static_configs: [{targets: ["loadgen:9102"]}]
