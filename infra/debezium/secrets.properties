# Resolved at runtime by Connect's FileConfigProvider, referenced from
# connector.json as ${file:/etc/kafka-connect/secrets.properties:db_user}.
#
# This file is committed with DEVELOPMENT credentials only. In any real
# deployment it is rendered from a secret manager at deploy time and never
# exists in git -- see DESIGN.md, "what I would do differently".
#
# The point of the indirection is that posting a connector config with an
# inline password writes that password into Connect's own config topic, in
# plaintext, where it stays forever and is readable by anything that can read
# the topic.
db_user=debezium
db_password=debezium
